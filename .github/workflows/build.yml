name: Roblox APK Full Decode
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Download APK from GitHub Release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-input"
          curl --fail --location --retry 3 \
            "https://github.com/Tvmanisback/MT-Mods/releases/download/Test/Roblox_2.745.1137.apk" \
            -o "$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"
          test -s "$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"

      - name: Fully decode APK with Apktool
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"
          rm -rf inspection/decompiled
          mkdir -p inspection
          # Full Apktool decode: manifest, resources, assets, native libraries,
          # and DEX bytecode translated to Smali source files.
          apktool d --force --output inspection/decompiled "$APK"
          printf '%s\n' \
            "# Full APK decode" \
            "" \
            "Decoded with Apktool, including DEX-to-Smali output where supported." \
            "Original APK remains in the GitHub Release; it is not copied into this repository." \
            > inspection/README.md
          sha256sum "$APK" > inspection/apk-sha256.txt
          du -sh inspection/decompiled

      - name: Commit decoded files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A inspection/
          if git diff --cached --quiet; then
            echo "Decoded output has not changed."
            exit 0
          fi
          # GitHub rejects individual files larger than 100 MB. If the decode
          # exceeds repository limits, preserve the run output as an artifact
          # instead of silently truncating or modifying the decoded tree.
          if git diff --cached --name-only -z | xargs -0 -r -I{} sh -c 'test ! -f "$1" || test "$(stat -c%s "$1")" -le 100000000' _ {} ; then
            git commit -m "Add full APK decode for inspection [skip ci]"
            git push
          else
            echo "A decoded file exceeds GitHub's 100 MB per-file limit."
            exit 1
          fi

      - name: Upload decoded tree if commit limits are exceeded
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-apk-full-decode
          path: inspection/decompiled/
          if-no-files-found: warn
          retention-days: 7
