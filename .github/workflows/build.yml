name: ASSOCIATED Modding Package Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ZIP utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Download decoded project archive
        env:
          INPUT_URL: https://github.com/Tvmanisback/MT-Mods/releases/download/Test/roblox-apk-full-decode.zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input" output
          curl --fail --location --retry 3 "$INPUT_URL" \
            -o "$RUNNER_TEMP/input/roblox-apk-full-decode.zip"
          test -s "$RUNNER_TEMP/input/roblox-apk-full-decode.zip"
          unzip -t "$RUNNER_TEMP/input/roblox-apk-full-decode.zip"

      - name: Validate decoded archive and record metadata
        env:
          ARCHIVE: ${{ runner.temp }}/input/roblox-apk-full-decode.zip
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import zipfile

          archive = pathlib.Path(os.environ["ARCHIVE"])
          report = pathlib.Path("output/input-report.txt")
          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if not n.endswith("/")]
              basenames = {pathlib.PurePosixPath(n).name for n in names}
              required = {"AndroidManifest.xml", "apktool.yml"}
              missing = required - basenames
              if missing:
                  raise SystemExit("Decoded archive is missing: " + ", ".join(sorted(missing)))
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          report.write_text(
              "Decoded input archive validated.\n"
              f"Archive: {archive.name}\n"
              f"Files: {len(names)}\n"
              f"SHA-256: {digest}\n",
              encoding="utf-8",
          )
          PY

      - name: Package mod source and visual resources
        run: |
          set -euo pipefail
          mkdir -p output/ASSOCIATED-Modding-Kit
          cp -R mods framework res output/ASSOCIATED-Modding-Kit/
          cp README.md output/ASSOCIATED-Modding-Kit/
          (
            cd output
            zip -qr ASSOCIATED-Modding-Kit.zip ASSOCIATED-Modding-Kit
          )
          sha256sum output/ASSOCIATED-Modding-Kit.zip > output/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ASSOCIATED-Modding-Package
          path: |
            output/ASSOCIATED-Modding-Kit.zip
            output/input-report.txt
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
