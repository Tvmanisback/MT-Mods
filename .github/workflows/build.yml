name: Package Roblox 1.0.0 APK with MT-Mods

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MT-Mods
        uses: actions/checkout@v4

      - name: Install Android APK build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zip unzip curl cmake ninja-build
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK_ROOT/cmdline-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Download original APK and prepare additions
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Tvmanisback/MT-Mods/releases/download/Test/Roblox_2.745.1137.apk" \
            -o "$RUNNER_TEMP/Roblox-original.apk"
          test -s "$RUNNER_TEMP/Roblox-original.apk"
          mkdir -p "$RUNNER_TEMP/apk-additions/assets/mt-mods" output

      - name: Bundle MT-Mods source as APK assets
        run: |
          set -euo pipefail
          cp -R framework mods "$RUNNER_TEMP/apk-additions/assets/mt-mods/"
          if [ -d res ]; then
            cp -R res "$RUNNER_TEMP/apk-additions/assets/mt-mods/"
          fi
          cp README.md "$RUNNER_TEMP/apk-additions/assets/mt-mods/README.md"
          cat > "$RUNNER_TEMP/apk-additions/assets/mt-mods/BUILD-INFO.txt" <<'EOF'
          MT-Mods 1.0.0 source bundle
          Included: framework, mods, resources, README.
          Luau VM shared library is packaged at lib/arm64-v8a/libmtluau.so.
          The host app must compile/call the JNI wrapper and provide engine API bindings.
          This package does not inject into the client or bypass anti-cheat.
          EOF

      - name: Build embedded Luau runtime for Android ARM64
        run: |
          set -euo pipefail
          cmake -S native -B "$RUNNER_TEMP/mtluau-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/mtluau-build" --config Release --parallel 2
          LIBRARY="$(find "$RUNNER_TEMP/mtluau-build" -name libmtluau.so -print -quit)"
          test -n "$LIBRARY"
          mkdir -p "$RUNNER_TEMP/apk-additions/lib/arm64-v8a"
          cp "$LIBRARY" "$RUNNER_TEMP/apk-additions/lib/arm64-v8a/libmtluau.so"
          mkdir -p "$RUNNER_TEMP/apk-additions/assets/mt-mods/native"
          cp -R native/java "$RUNNER_TEMP/apk-additions/assets/mt-mods/native/"
          cp native/README.md "$RUNNER_TEMP/apk-additions/assets/mt-mods/native/README.md"

      - name: Add MT-Mods files without rebuilding Android resources
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/Roblox-original.apk" "$RUNNER_TEMP/Roblox-1.0.0-unsigned.apk"
          (
            cd "$RUNNER_TEMP/apk-additions"
            zip -q -r "$RUNNER_TEMP/Roblox-1.0.0-unsigned.apk" assets/mt-mods lib/arm64-v8a/libmtluau.so
          )
          zipalign -f -p 4 "$RUNNER_TEMP/Roblox-1.0.0-unsigned.apk" "$RUNNER_TEMP/Roblox-1.0.0-aligned.apk"
          test -s "$RUNNER_TEMP/Roblox-1.0.0-aligned.apk"

      - name: Sign rebuilt APK with a temporary CI debug key
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=CI Debug,O=MT-Mods,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          apksigner sign \
            --ks "$RUNNER_TEMP/ci-debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output/Roblox-1.0.0.apk \
            "$RUNNER_TEMP/Roblox-1.0.0-aligned.apk"
          apksigner verify --verbose output/Roblox-1.0.0.apk
          unzip -t output/Roblox-1.0.0.apk
          test -s output/Roblox-1.0.0.apk
          sha256sum output/Roblox-1.0.0.apk > output/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-1.0.0
          path: |
            output/Roblox-1.0.0.apk
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
