name: ASSOCIATED APK Inspection
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: |
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Download release APK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-input"
          curl --fail --location --retry 3 "https://github.com/Tvmanisback/MT-Mods/releases/download/Test/Roblox_2.745.1137.apk" -o "$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"
          test -s "$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"
      - name: Create read-only inspection report
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"
          mkdir -p inspection
          {
            echo "# Roblox VR APK inspection"
            echo
            echo "- Source: release asset Test/Roblox_2.745.1137.apk"
            echo "- Mode: read-only package metadata and archive inventory"
            echo "- Size: $(du -h "$APK" | cut -f1)"
            echo "- SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
            echo
            echo "## Package metadata"
            echo '~~~text'
            aapt dump badging "$APK"
            echo '~~~'
            echo
            echo "## Requested permissions"
            echo '~~~text'
            aapt dump permissions "$APK"
            echo '~~~'
            echo
            echo "## Archive entries (first 500)"
            echo '~~~text'
            unzip -Z1 "$APK" | head -n 500
            echo '~~~'
          } > inspection/apk-report.md
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add inspection/apk-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update APK inspection report [skip ci]"
          git push
