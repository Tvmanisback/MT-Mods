name: Build Roblox 1.0.0 Modded APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MT-Mods
        uses: actions/checkout@v4

      - name: Install Android APK build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zip unzip curl cmake ninja-build
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK_ROOT/cmdline-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install current Apktool
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Download decoded client project
        env:
          INPUT_URL: https://github.com/Tvmanisback/MT-Mods/releases/download/Test/roblox-apk-full-decode.zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/client" output
          curl --fail --location --retry 3 "$INPUT_URL" -o "$RUNNER_TEMP/client/decoded-client.zip"
          unzip -q "$RUNNER_TEMP/client/decoded-client.zip" -d "$RUNNER_TEMP/client/unpacked"

      - name: Locate decoded APKTool project
        run: |
          set -euo pipefail
          PROJECT="$(find "$RUNNER_TEMP/client/unpacked" -type f -name apktool.yml -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/AndroidManifest.xml" ]; then
            echo "::error::The supplied ZIP does not contain a valid decoded APKTool project."
            exit 1
          fi
          echo "DECODED_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Decoded project: $PROJECT"

      - name: Bundle the complete MT-Mods source into APK assets
        run: |
          set -euo pipefail
          mkdir -p "$DECODED_PROJECT/assets/mt-mods"
          cp -R framework "$DECODED_PROJECT/assets/mt-mods/"
          cp -R mods "$DECODED_PROJECT/assets/mt-mods/"
          if [ -d res ]; then
            cp -R res "$DECODED_PROJECT/assets/mt-mods/"
          fi
          cp README.md "$DECODED_PROJECT/assets/mt-mods/README.md"
          cat > "$DECODED_PROJECT/assets/mt-mods/BUILD-INFO.txt" <<'EOF'
          MT-Mods 1.0.0 source bundle
          Included: framework, mods, resources, README.
          Luau VM shared library is packaged at lib/arm64-v8a/libmtluau.so.
          The Java JNI wrapper is included as source under assets/mt-mods/native.
          The host app must compile/call that wrapper and provide any engine API bindings.
          This package does not inject into the client or bypass anti-cheat.
          EOF


      - name: Build embedded Luau runtime for Android ARM64
        run: |
          set -euo pipefail
          cmake -S native -B "$RUNNER_TEMP/mtluau-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/mtluau-build" --config Release --parallel 2
          LIBRARY="$(find "$RUNNER_TEMP/mtluau-build" -name libmtluau.so -print -quit)"
          test -n "$LIBRARY"
          mkdir -p "$DECODED_PROJECT/lib/arm64-v8a"
          cp "$LIBRARY" "$DECODED_PROJECT/lib/arm64-v8a/libmtluau.so"
          mkdir -p "$DECODED_PROJECT/assets/mt-mods/native"
          cp -R native/java "$DECODED_PROJECT/assets/mt-mods/native/"
          cp native/README.md "$DECODED_PROJECT/assets/mt-mods/native/README.md"

      - name: Rebuild APK with APKTool
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" b "$DECODED_PROJECT" -o "$RUNNER_TEMP/Roblox-1.0.0-unsigned.apk"
          test -s "$RUNNER_TEMP/Roblox-1.0.0-unsigned.apk"
          zipalign -f -p 4 "$RUNNER_TEMP/Roblox-1.0.0-unsigned.apk" "$RUNNER_TEMP/Roblox-1.0.0-aligned.apk"

      - name: Sign rebuilt APK with a temporary CI debug key
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=CI Debug,O=MT-Mods,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          apksigner sign \
            --ks "$RUNNER_TEMP/ci-debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output/Roblox-1.0.0.apk \
            "$RUNNER_TEMP/Roblox-1.0.0-aligned.apk"
          apksigner verify --verbose output/Roblox-1.0.0.apk
          unzip -t output/Roblox-1.0.0.apk
          test -s output/Roblox-1.0.0.apk
          sha256sum output/Roblox-1.0.0.apk > output/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-1.0.0
          path: |
            output/Roblox-1.0.0.apk
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
