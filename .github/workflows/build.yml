name: Roblox APK Inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Download APK from GitHub Release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-input"
          curl --fail --location --retry 3 \
            "https://github.com/Tvmanisback/MT-Mods/releases/download/Test/Roblox_2.745.1137.apk" \
            -o "$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"
          test -s "$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"

      - name: Inspect package without decompiling executable code
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"
          mkdir -p inspection

          {
            echo "# Roblox APK inspection"
            echo
            echo "- Release asset: `Test/Roblox_2.745.1137.apk`"
            echo "- APK size: $(du -h "$APK" | cut -f1)"
            echo "- SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
            echo "- Inspection scope: package metadata, decoded manifest, permissions, and archive index."
            echo "- No DEX/smali decompilation or executable-code modification is performed."
          } > inspection/README.md

          aapt dump badging "$APK" > inspection/package-info.txt
          aapt dump permissions "$APK" > inspection/permissions.txt
          aapt dump xmltree "$APK" AndroidManifest.xml > inspection/manifest-tree.txt
          unzip -Z1 "$APK" > inspection/archive-index.txt

      - name: Commit inspection files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add inspection/
          if git diff --cached --quiet; then
            echo "Inspection output has not changed."
            exit 0
          fi
          git commit -m "Add read-only Roblox APK inspection output [skip ci]"
          git push
