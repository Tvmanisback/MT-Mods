name: Roblox APK Resource Decode
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Download APK from GitHub Release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-input"
          curl --fail --location --retry 3 \
            "https://github.com/Tvmanisback/MT-Mods/releases/download/Test/Roblox_2.745.1137.apk" \
            -o "$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"
          test -s "$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"

      - name: Decode manifest and resources
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/apk-input/Roblox_2.745.1137.apk"
          rm -rf inspection/decompiled
          mkdir -p inspection
          # Decode Android resources and manifest, while deliberately skipping
          # DEX-to-smali output and executable-code reconstruction.
          apktool d --no-src --force -o inspection/decompiled "$APK"
          mkdir -p inspection
          printf '%s\n' \
            "# APK resource decode" \
            "" \
            "Decoded AndroidManifest.xml and Android resources with Apktool." \
            "DEX/smali executable-code decompilation is not included." \
            > inspection/README.md
          sha256sum "$APK" > inspection/apk-sha256.txt

      - name: Commit decoded files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A inspection/
          if git diff --cached --quiet; then
            echo "Decoded output has not changed."
            exit 0
          fi
          git commit -m "Decode APK resources for inspection [skip ci]"
          git push
